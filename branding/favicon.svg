<svg xmlns="http://www.w3.org/2000/svg"
     width="64"
     height="64"
     viewBox="0 0 64 64"
     role="img"
     aria-labelledby="favicon-title">

  <title id="favicon-title">leyoNET</title>

  <!-- Hintergrund -->
  <rect width="64" height="64" rx="14" fill="#ffffff"/>

  <!-- Netzwerk-l -->
  <g fill="none"
     stroke="#000000"
     stroke-width="4"
     stroke-linecap="round">
    <path d="M 13,13 L 13,43"/>
  </g>

  <!-- Netzwerk-y -->
  <path d="M 29,25 L 40,39 L 53,25
           M 40,39 L 32,53"
        fill="none"
        stroke="#000000"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Endknoten für l und y -->
  <g fill="#000000">
    <circle cx="13" cy="13" r="4.5"/>
    <circle cx="13" cy="43" r="4.5"/>

    <circle cx="29" cy="25" r="4.5"/>
    <circle cx="53" cy="25" r="4.5"/>
    <circle cx="32" cy="53" r="4.5"/>
  </g>

</svg>