# Nginx für den Netzwerk-Simulator: liefert nur eine statische Datei aus.
# Datenschutz: keine Zugriffsprotokolle (Konzept, Abschnitt 7.4).

server {
    listen 80;
    server_name _;

    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Dieselbe Richtlinie wie in der Datei selbst: keinerlei Netzwerkzugriffe aus der Seite.
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri /index.html;
    }

    # Neue Versionen sollen sofort ankommen: nicht zwischenspeichern.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
