[package]
name = "leyonet"
version = "0.5.0"
description = "leyoNET für den Informatik-Unterricht"
authors = ["Mark von Allmen", "Mikael von Allmen"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/vonam-git/leyoNET"
edition = "2021"
rust-version = "1.77"

[lib]
name = "leyonet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
